<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Audrey Grammar">
<title>Audrey Grammar Review</title>
<style>
:root{--bg:#fff8ef;--card:#ffffff;--ink:#2b2d42;--muted:#6c6f86;--pri:#ff7a45;--pri2:#ffb703;--ok:#2a9d8f;--okbg:#e3f6f3;--bad:#e63946;--badbg:#fde8ea;--hl:#fff3a3;--line:#ecdcc8;--blue:#3a86ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px}
header{background:linear-gradient(135deg,#ff7a45,#ffb703);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.1)}
header h1{margin:0;font-size:22px}
header .sub{font-size:13px;opacity:.95}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:4;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:15px;color:var(--ink);cursor:pointer}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent}
.tcard:hover{border-color:var(--pri2)}
.tcard .ic{font-size:34px}
.tcard h3{margin:6px 0 4px;font-size:18px}
.tcard .meta{font-size:14px;color:var(--muted)}
.bar{height:8px;background:#f1e6d8;border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ok)}
.qcard{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.ins{font-size:15px;font-weight:700;color:#7a4a1d;background:#fff0e3;border-radius:8px;padding:6px 10px;display:inline-block}
.qtext{font-size:22px;line-height:1.45;margin:10px 0 14px}
.ctx{background:#fbf6ee;border:1px dashed var(--line);border-radius:12px;padding:12px;margin:8px 0 12px;font-size:16px;line-height:1.5;overflow-x:auto}
.ctx table{border-collapse:collapse;margin:0 auto;font-size:15px}
.ctx td,.ctx th{border:1px solid #d9c7ae;padding:5px 9px;text-align:center}
.ctx th{background:#f3e5d0}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.line .front{background:var(--blue);color:#fff;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700}
.line .person{background:#fff;border:1px solid #d9c7ae;border-radius:8px;padding:3px 8px}
.line .arrow{color:var(--muted)}
.scene{text-align:center}
.scene .lbl{font-size:12px;color:var(--muted);letter-spacing:1px;margin:4px 0}
.scene .row{display:flex;justify-content:center;gap:18px;align-items:flex-end}
.scene .obj{text-align:center;font-size:14px}
.scene .em{font-size:44px;line-height:1.1}
.scene .shelf{border-top:4px solid #b08968;width:150px;margin:2px auto}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:19px;cursor:pointer;color:var(--ink)}
.choice.sel{border-color:var(--blue);background:#eef4ff}
.choice.right{border-color:var(--ok);background:var(--okbg)}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.choice b{display:inline-block;width:28px;color:var(--muted)}
input.ans{width:100%;font-size:21px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none;font-family:inherit}
input.ans:focus{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer;color:var(--ink)}
.chip.used{opacity:.25;pointer-events:none}
.build{min-height:56px;border:2px dashed var(--blue);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;background:#f6f9ff}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:18px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.blue{background:var(--blue)}
.btn.sm{padding:8px 12px;font-size:15px}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:18px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.correct{background:var(--hl);border-radius:12px;padding:14px;margin-top:10px;font-size:22px;font-weight:800;color:#5a4500}
.correct small{display:block;font-size:13px;font-weight:600;color:#8a6d00;margin-bottom:4px}
.prog{height:10px;background:#f1e6d8;border-radius:6px;overflow:hidden;margin-bottom:12px}
.prog>i{display:block;height:100%;background:var(--pri)}
.score{text-align:center}
.score .big{font-size:56px;font-weight:800;color:var(--pri)}
.score .stars{font-size:38px}
.rev{border-radius:12px;padding:12px;margin:8px 0;background:#fff;border-left:6px solid var(--ok);font-size:16px}
.rev.x{border-left-color:var(--bad)}
.rev .q{font-weight:600;margin-bottom:4px}
.intro{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.intro h2{margin:0 0 6px}
.oral{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.oral .oq{font-size:21px;font-weight:700}
.oral .os{margin:8px 0;padding:10px;background:#f6f9ff;border-radius:10px}
.oral .ok2{font-size:14px;color:var(--muted)}
.oral .res{margin-top:8px;font-size:16px}
.oral mark{background:#bff0d8;border-radius:4px;padding:0 2px}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>🦉 Audrey's Grammar Review</h1><div class="sub">Midterm Grammar Exam · Thu 10/22 · Pathway 3 Unit 1 (p.4-13) &amp; Unit 4 (p.34-36)</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
"use strict";
/* ====================== helpers ====================== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
const CONTR=[["what's","what is"],["it's","it is"],["isn't","is not"],["he's","he is"],["she's","she is"],["that's","that is"],["i'm","i am"],["don't","do not"],["doesn't","does not"],["aren't","are not"],["when's","when is"]];
function norm(s){
  s=String(s||"").toLowerCase().replace(/[‘’`]/g,"'").replace(/[“”"]/g,"");
  s=s.replace(/-/g," ");
  CONTR.forEach(function(p){s=s.split(p[0]).join(p[1]);});
  s=s.replace(/[.,!?;:()]/g," ").replace(/\s+/g," ").trim();
  return s;
}
function lineCtx(names,numbered){
  return "<div class='line'><span class='front'>🚩 FRONT</span>"+names.map(function(n,i){return "<span class='person'>"+(numbered?(i+1)+". ":"")+n+"</span>";}).join("<span class='arrow'>→</span>")+"</div>";
}
function tableCtx(head,rows){
  return "<table><tr>"+head.map(function(h){return "<th>"+h+"</th>";}).join("")+"</tr>"+rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";}).join("")+"</table>";
}
function obj(o){return "<div class='obj'><div class='em'>"+o[0]+"</div><div>"+o[1]+"</div></div>";}
function rowScene(items){return "<div class='scene'><div class='lbl'>LEFT ⟵ &nbsp; ⟶ RIGHT</div><div class='row'>"+items.map(obj).join("")+"</div></div>";}
function depthScene(front,back){return "<div class='scene'><div class='lbl'>BACK (far from you)</div><div class='row'>"+obj(back)+"</div><div class='lbl'>FRONT (near you)</div><div class='row'>"+obj(front)+"</div></div>";}
function stackScene(top,bottom){return "<div class='scene'><div class='row'>"+obj(top)+"</div><div class='shelf'></div><div class='row'>"+obj(bottom)+"</div></div>";}

/* ====================== tabs (named after worksheet sections) ====================== */
const TABS=[
  {key:"ord",icon:"🔢",name:"Ordinal Numbers",desc:"Spell numbers and ordinals, dates, months and letters"},
  {key:"line",icon:"🚌",name:"Waiting in Line",desc:"Who is fifth in line? Clues and Climbing the ladder"},
  {key:"floor",icon:"🏢",name:"Building & Floors",desc:"Which floor is it on? He lives on the ___ floor."},
  {key:"freq",icon:"📅",name:"How often…?",desc:"always / usually / sometimes / never, twice a week"},
  {key:"verb",icon:"✏️",name:"He / She / It + s / es",desc:"Circle the correct verb form, do / does"},
  {key:"prep",icon:"📦",name:"be V + Prepositions",desc:"is / are + in front of, behind, next to, between, under, on"},
  {key:"wea",icon:"🌦️",name:"What's the weather like?",desc:"Label, write, and match · Is it sunny?"},
  {key:"read",icon:"📖",name:"Dialogue & Reading",desc:"Unscramble, Dialogue Completion, Reading Comprehension"}
];

/* ====================== question bank ====================== */
const questionBank=[];const CNT={};
function add(tab,ins,o){CNT[tab]=(CNT[tab]||0)+1;o.tab=tab;o.ins=ins;o.id=tab+"_"+String(CNT[tab]).padStart(3,"0");if(!Array.isArray(o.answer))o.answer=[o.answer];questionBank.push(o);return o;}
function mc(tab,ins,q,choices,a,x){return add(tab,ins,Object.assign({type:"mc",question:q,choices:choices,answer:a},x||{}));}
function fill(tab,ins,q,a,x){return add(tab,ins,Object.assign({type:"fill",question:q,answer:a,choices:null},x||{}));}
function sent(tab,ins,q,a,x){return add(tab,ins,Object.assign({type:"sentence",question:q,answer:a,choices:null},x||{}));}
function unscr(tab,ins,words,a,x){return add(tab,ins,Object.assign({type:"unscramble",question:"",words:words,answer:a,choices:null},x||{}));}

const ORD=[[1,"first"],[2,"second"],[3,"third"],[4,"fourth"],[5,"fifth"],[6,"sixth"],[7,"seventh"],[8,"eighth"],[9,"ninth"],[10,"tenth"],[11,"eleventh"],[12,"twelfth"],[13,"thirteenth"],[14,"fourteenth"],[15,"fifteenth"],[16,"sixteenth"],[17,"seventeenth"],[18,"eighteenth"],[19,"nineteenth"],[20,"twentieth"],[21,"twenty-first"],[22,"twenty-second"],[30,"thirtieth"]];
function suf(n){if([11,12,13].indexOf(n%100)>=0)return n+"th";return n+({1:"st",2:"nd",3:"rd"}[n%10]||"th");}
function ow(i){return ORD[i][1];}

/* ---------- 1. Ordinal Numbers ---------- */
(function(){
  const T="ord";
  const WEAK=[5,8,9,11,12,13,19,20,30];
  ORD.forEach(function(p){fill(T,"Ordinal Numbers — write the ordinal number word.","<b>"+suf(p[0])+"</b>",p[1],{weak:WEAK.indexOf(p[0])>=0});});
  [[7,"seven"],[8,"eight"],[11,"eleven"],[12,"twelve"],[13,"thirteen"],[14,"fourteen"],[20,"twenty"],[21,"twenty-one"],[22,"twenty-two"],[30,"thirty"]].forEach(function(p){fill(T,"Number (Word) — write the number in words.","<b>"+p[0]+"</b>",p[1]);});
  [[2,"second"],[3,"third"],[12,"twelfth"],[21,"twenty-first"],[22,"twenty-second"],[30,"thirtieth"]].forEach(function(p){fill(T,"Ordinal Number (number) — write it like 4th.","<b>"+p[1]+"</b>",suf(p[0]));});
  [["8/2","August second"],["8/3","August third"],["9/5","September fifth"],["9/6","September sixth"],["9/7","September seventh"],["10/8","October eighth"],["10/9","October ninth"],["10/10","October tenth"],["10/21","October twenty-first"],["5/1","May first"],["11/3","November third"],["10/22","October twenty-second"]].forEach(function(p,i){
    fill(T,"Date (ordinal number word)","<b>"+p[0]+"</b>",p[1],{weak:i<2});
  });
  [["8/2","August 2nd"],["9/7","September 7th"],["10/9","October 9th"],["10/21","October 21st"],["11/3","November 3rd"]].forEach(function(p){fill(T,"Date (ordinal number)","<b>"+p[0]+"</b>",p[1]);});
  fill(T,"Fill in the blank.","Wednesday is the ____ day of the week.","third");
  fill(T,"Fill in the blank.","Friday is the ____ day of the week.","fifth");
  fill(T,"Fill in the blank.","A is the ____ letter in the alphabet.","first");
  fill(T,"Fill in the blank.","B is the ____ letter in the alphabet.","second");
  fill(T,"Fill in the blank.","____ is the 10th letter in the alphabet.","J");
  fill(T,"Fill in the blank.","August is the ____ month of the year.","eighth");
  fill(T,"Fill in the blank.","____ is the 3rd month of the year.","March");
  fill(T,"Fill in the blank.","September is the ____ month of the year.","ninth");
  fill(T,"Fill in the blank.","October is the ____ month of the year.","tenth");
  fill(T,"Fill in the blank.","November is the ____ month of the year.","eleventh",{weak:true});
  fill(T,"Fill in the blank.","December is the ____ month of the year.","twelfth",{weak:true});
  fill(T,"Fill in the blank.","Two is the ____ number.","second");
  const RC="Read and choose.";
  mc(T,RC,"Which sentence is correct?",["My birthday is on May first.","My birthday is on May oneth."],"My birthday is on May first.");
  mc(T,RC,"Which sentence is correct?",["Amy is fifth in line.","Amy is fiveth in line."],"Amy is fifth in line.",{weak:true});
  mc(T,RC,"Which sentence is correct?",["Sally is ninth in line.","Sally is nineth in line."],"Sally is ninth in line.",{weak:true});
  mc(T,RC,"Which sentence is correct?",["My birthday is on December twelfth.","My birthday is on December twelveth."],"My birthday is on December twelfth.",{weak:true});
  mc(T,RC,"Which sentence is correct?",["Today is October eleventh.","Today is October eleveth."],"Today is October eleventh.",{weak:true});
  mc(T,RC,"Which sentence is correct?",["The party is on June twentieth.","The party is on June twenteenth."],"The party is on June twentieth.",{weak:true});
  mc(T,RC,"Which sentence is correct?",["Today is May thirtieth.","Today is May thirteenth."],"Today is May thirtieth.",{weak:true});
  const MCI="A. Multiple Choice";
  mc(T,MCI,"Today is the ____ day of the school fair. Everyone is excited!",["one","first","1th"],"first");
  mc(T,MCI,"My sister's birthday is on November ____.",["3th","3st","3rd"],"3rd");
  mc(T,MCI,"Sandy was the ____ runner in the race, so she won the silver medal (2nd place).",["first","second","third"],"second");
})();

/* ---------- 2. Waiting in Line ---------- */
const ANIMALS=["Bear","Rabbit","Fox","Tiger","Deer","Panda","Monkey"];
const KIDS=["Leo","Mia","Sam","Toby","Amy","Kevin","Zoe","Ben"];
const ZOO=["Ben","Lily","Ryan","Kevin","Emma","Amy","Jack","Mia","Leo","Zoe"];
const MOVIE=["Jane","Jack","Jim","Vicky","Lily","Peter","John","Fred","Sally"];
const BUS=[["Kate","She"],["Liz","She"],["Mr. Boris","He"],["Mary","She"],["Susan","She"],["James","He"],["Tim","He"],["Helen","She"],["Mrs. Grey","She"],["Janet","She"]];
(function(){
  const T="line";
  const W1="Waiting in Line: Look at the animals and write the ordinal numbers.";
  ANIMALS.forEach(function(n,i){if(i>0)fill(T,W1,n+" is ____ in line.",ow(i),{ctx:lineCtx(ANIMALS,true)});});
  const W2="Waiting in Line: Look at the line and fill in the correct ordinal numbers.";
  KIDS.forEach(function(n,i){if(i>0)fill(T,W2,n+" is ____ in line.",ow(i),{ctx:lineCtx(KIDS,true)});});
  const ZC=lineCtx(ZOO.map(function(n,i){return ["🐻","🐰","🦝","🐱","🐧","🐸","🐼","🐶","🐘","🐯"][i]+" "+n;}),false);
  ZOO.forEach(function(n,i){fill(T,"Waiting in line — write the ordinal number.",n+" is ____ in line.",ow(i),{ctx:ZC,weak:i===9});});
  fill(T,"Waiting in line — write the name.","Who is fourth in line?","Kevin",{ctx:ZC});
  fill(T,"Waiting in line — write the name.","Who is sixth in line?","Amy",{ctx:ZC});
  fill(T,"Waiting in line — write the name.","Who is eighth in line?","Mia",{ctx:ZC});
  const MC5=lineCtx(MOVIE,false);
  MOVIE.forEach(function(n,i){fill(T,"Read, label, and complete.",n+" is ____ in line.",ow(i),{ctx:MC5,weak:i===8});});
  fill(T,"Read, label, and complete.","Who is fifth in line?","Lily",{ctx:MC5});
  fill(T,"Read, label, and complete.","Who is seventh in line?","John",{ctx:MC5});
  const BC=lineCtx(BUS.map(function(b){return b[0];}),false)+"<div class='note' style='margin-top:6px'>Where is James? He is sixth in line.</div>";
  BUS.forEach(function(p,i){if(p[0]!=="James")sent(T,"Waiting in line… Answer the questions.","Where is "+p[0]+"?",p[1]+" is "+ow(i)+" in line.",{ctx:BC});});
  const CL="<b>Clues:</b><br>1. Ben is first in line.<br>2. Eva is behind Zoe.<br>3. Tom is behind Ben.<br>4. Lucy is next to Tom.<br>5. Mark is between Lucy and Zoe.<br>6. Zoe is in front of Eva.<br>7. Leo is in front of Emma.<br>8. Emma is last in line.";
  const PA="Part A: Read the clues and write the correct name for each number (1st to 8th).";
  ["Ben","Tom","Lucy","Mark","Zoe","Eva","Leo","Emma"].forEach(function(n,i){if(i>0)fill(T,PA,suf(i+1)+": ____",n,{ctx:CL});});
  const PB="Part B: Complete the sentences using ordinal words (first, second, third, etc.).";
  [["Mark","fourth"],["Leo","seventh"],["Eva","sixth"],["Zoe","fifth"],["Lucy","third"],["Tom","second"]].forEach(function(p){fill(T,PB,p[0]+" is ____ in line.",p[1],{ctx:CL});});
  const LD="<b>Climbing the ladder</b> (the bottom step is the 1st step)<br>🐸 frog: step 1 · 🐰 rabbit: step 2 · 🐦 bird: step 6 · 🐶 dog: step 8 · 🐍 snake: step 9";
  [["frog","first"],["rabbit","second"],["bird","sixth"],["dog","eighth"],["snake","ninth"]].forEach(function(p){fill(T,"Climbing the ladder",p[0]==="frog"?"The frog is on the ____ step.":"The "+p[0]+" is on the ____ step.",p[1],{ctx:LD});});
  const SG="<b>Let's sing! — Waiting in Line</b>"+tableCtx(["Position","Child"],[["3","Dutch boy"],["4","Dutch girl"],["5","English girl"],["6","Mexican boy"],["7","Chinese boy"],["9","Japanese child"],["11","French child"],["12","Japanese child"]]);
  fill(T,"Let's sing! — write the ordinal number.","The Mexican boy is ____ in line.","sixth",{ctx:SG});
  fill(T,"Let's sing! — write the ordinal number.","The English girl is ____ in line.","fifth",{ctx:SG});
  fill(T,"Let's sing! — write the ordinal number.","The French child is ____ in line.","eleventh",{ctx:SG,weak:true});
  fill(T,"Let's sing! — write the ordinal number.","The Chinese boy is ____ in line.","seventh",{ctx:SG});
  fill(T,"Let's sing! — write the ordinal number.","One Japanese child is ninth. The other is ____.","twelfth",{ctx:SG,weak:true});
})();

/* ---------- 3. Building & Floors ---------- */
(function(){
  const T="floor";
  const HI="Sunshine Hotel: Look at the directory and answer in full sentences.";
  const HOTEL=tableCtx(["Floor","Place"],[["Floor 6","Sky Garden &amp; Cafe"],["Floor 5","Swimming Pool"],["Floor 4","Italian Restaurant"],["Floor 3","Toy &amp; Game Room"],["Floor 2","Bookstore"],["Floor 1","Front Desk &amp; Lobby"]]);
  sent(T,HI,"Which floor is the Italian Restaurant on?","It's on the fourth floor.",{ctx:HOTEL});
  sent(T,HI,"Gary wants to buy some comic books. Which floor does he go to?","He goes to the second floor.",{ctx:HOTEL,weak:true});
  sent(T,HI,"Where is the Swimming Pool?","It's on the fifth floor.",{ctx:HOTEL});
  sent(T,HI,"Which floor is the Sky Garden on?","It's on the sixth floor.",{ctx:HOTEL});
  sent(T,HI,"Which floor is the Toy & Game Room on?","It's on the third floor.",{ctx:HOTEL});
  sent(T,HI,"Which floor is the Front Desk on?","It's on the first floor.",{ctx:HOTEL});
  sent(T,HI,"Where is the Bookstore?","It's on the second floor.",{ctx:HOTEL});
  sent(T,HI,"Mom wants to swim. Which floor does she go to?","She goes to the fifth floor.",{ctx:HOTEL,weak:true});
  sent(T,HI,"Tom wants to play games. Which floor does he go to?","He goes to the third floor.",{ctx:HOTEL,weak:true});
  sent(T,HI,"Lisa wants to eat pizza. Which floor does she go to?","She goes to the fourth floor.",{ctx:HOTEL,weak:true});
  sent(T,HI,"Where is the Cafe?","It's on the sixth floor.",{ctx:HOTEL});
  const SI="Building & Floors: Answer in full sentences with ordinal numbers.";
  const SCHOOL=tableCtx(["Floor","Place"],[["Floor 5","Music Room &amp; Art Studio"],["Floor 4","Science Lab"],["Floor 3","Library &amp; Reading Corner"],["Floor 2","Gym &amp; Basketball Court"],["Floor 1","Cafeteria &amp; 7-11"]])+"<div class='note' style='margin-top:6px'>e.g. Which floor is the Science Lab on? → It's on the fourth floor.</div>";
  sent(T,SI,"Which floor is the Cafeteria on?","It's on the first floor.",{ctx:SCHOOL});
  sent(T,SI,"Andy can borrow storybooks on his favorite floor. Which floor does he go to?","He goes to the third floor.",{ctx:SCHOOL,weak:true});
  sent(T,SI,"Which floor is the Music Room on?","It's on the fifth floor.",{ctx:SCHOOL});
  sent(T,SI,"Lucas likes to play basketball on rainy days. Which floor does he play on?","He plays on the second floor.",{ctx:SCHOOL,weak:true});
  sent(T,SI,"Which floor is the Art Studio on?","It's on the fifth floor.",{ctx:SCHOOL});
  sent(T,SI,"Which floor is the Library on?","It's on the third floor.",{ctx:SCHOOL});
  sent(T,SI,"Where is the Gym?","It's on the second floor.",{ctx:SCHOOL});
  sent(T,SI,"Where is the 7-11?","It's on the first floor.",{ctx:SCHOOL});
  sent(T,SI,"Mia wants to paint a picture. Which floor does she go to?","She goes to the fifth floor.",{ctx:SCHOOL,weak:true});

  mc(T,RJ,"Who does Max ride his bicycle with?",["His brother.","His sister.","His dad."],"His brother.",{ctx:MX});
  mc(T,RJ,"Which floor does Max usually take the stairs to?",["The fifth floor.","The ninth floor.","The first floor."],"The fifth floor.",{ctx:MX});
})();

 {q:"When's your birthday?",s:"My birthday is on May first.",k:["my birthday","is on","first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|teenth|tieth|twenty"]},

/* ====================== storage ====================== */
const SKEY="audreyGrammar_P3U1U4_v2";
let STATS={};
try{STATS=JSON.parse(localStorage.getItem(SKEY)||"{}")||{};}catch(e){STATS={};}
function saveStats(){try{localStorage.setItem(SKEY,JSON.stringify(STATS));}catch(e){}}

/* ====================== app ====================== */
const app=document.getElementById("app");
const nav=document.getElementById("nav");
let S=null;
const NAVITEMS=[{key:"home",label:"🏠 Home"}].concat(TABS.map(function(t){return {key:t.key,label:t.icon+" "+t.name};}),[{key:"weak",label:"🔥 Fix My Mistakes"},{key:"mock",label:"🎯 Mock Exam"},{key:"oral",label:"🗣️ Oral Practice"}]);
let current="home";
function drawNav(){nav.innerHTML=NAVITEMS.map(function(n){return "<button class='"+(n.key===current?"on":"")+"' onclick=\"go('"+n.key+"')\">"+n.label+"</button>";}).join("");}
function weakList(){return questionBank.filter(function(q){return q.weak;});}
function tabList(key){return questionBank.filter(function(q){return q.tab===key;});}
function drawMockExam(){return shuffle(questionBank.slice()).slice(0,30);}
function go(key){
  current=key;drawNav();window.scrollTo(0,0);
  if(key==="home")return home();
  if(key==="oral")return oral();
  if(key==="mock")return startSession("mock","🎯 Mock Exam",drawMockExam());
  if(key==="weak")return startSession("weak","🔥 Fix My Mistakes",shuffle(weakList().slice()));
  const t=TABS.filter(function(x){return x.key===key;})[0];
  startSession(key,t.icon+" "+t.name,shuffle(tabList(key).slice()));
}
function pct(key){const s=STATS[key];return s?Math.round(s.best):0;}
function home(){
  const days=Math.ceil((new Date(2026,9,22)-new Date(new Date().toDateString()))/86400000);
  let h="<div class='intro' style='border-left:6px solid var(--pri)'><h2>📝 Grammar Midterm: Thu 10/22 "+(days>0?"· "+days+" day"+(days>1?"s":"")+" to go!":days===0?"· Today! Good luck! 🍀":"")+"</h2><div style='font-size:16px;line-height:1.6'>Pathway 3 · Unit 1 (p.4-13) · Unit 4 (p.34-36)<br>✅ Spell the Ordinal Numbers table<br>✅ Waiting in line &amp; “lives on the ___ floor”<br>✅ How often…?<br>✅ He / She / It + does, verb + s / es / ies — <b>don't forget the s!</b><br>✅ Prepositions: in front of, under, next to, between…<br>✅ What's the weather like?</div></div>";
  h+="<div class='intro'><h2>Hi Audrey! 👋</h2><div>Pick a topic and practice. Press <b>Check Answer</b> after each question. The <b>🎯 Mock Exam</b> gives you 30 new random questions every time!</div><div class='note' style='margin-top:6px'>Question bank: "+questionBank.length+" questions</div></div><div class='grid'>";
  TABS.forEach(function(t){h+=card(t.key,t.icon,t.name,t.desc,tabList(t.key).length);});
  h+=card("weak","🔥","Fix My Mistakes","Question types you missed on your quizzes",weakList().length);
  h+=card("mock","🎯","Mock Exam","30 random questions from every topic",30);
  h+="<div class='tcard' onclick=\"go('oral')\"><div class='ic'>🗣️</div><h3>Oral Practice</h3><div class='meta'>"+ORAL.length+" speaking cards</div></div>";
  app.innerHTML=h+"</div>";
}
function card(key,ic,name,desc,n){const p=pct(key);return "<div class='tcard' onclick=\"go('"+key+"')\"><div class='ic'>"+ic+"</div><h3>"+name+"</h3><div class='meta'>"+desc+"</div><div class='meta' style='margin-top:6px'>"+n+" questions · best "+p+"%</div><div class='bar'><i style='width:"+p+"%'></i></div></div>";}
function startSession(key,title,list){
  S={key:key,title:title,list:list.map(function(q){const c=Object.assign({},q);if(c.choices)c.order=shuffle(c.choices.slice());if(c.words)c.wordOrder=shuffle(c.words.map(function(w){return {w:w};}));return c;}),idx:0,res:[],checked:false,sel:null,built:[]};
  renderQ();
}
function renderQ(){
  const q=S.list[S.idx];const n=S.list.length;
  let h="";
  if(S.key==="mock")h+="<div class='btns' style='margin:0 0 12px'><button class='btn blue' onclick=\"go('mock')\">🔀 New Random Set</button></div>";
  h+="<div class='prog'><i style='width:"+(S.idx/n*100)+"%'></i></div><div class='qcard'><div class='qtop'><span>"+S.title+"</span><span>Question "+(S.idx+1)+" / "+n+"</span></div>";
  h+="<div class='ins'>"+q.ins+"</div>";
  if(q.ctx)h+="<div class='ctx'>"+q.ctx+"</div>";
  if(q.question)h+="<div class='qtext'>"+q.question+"</div>";
  if(q.type==="mc"){
    h+="<div class='choices'>"+q.order.map(function(c,i){return "<button class='choice' data-i='"+i+"' onclick='pick("+i+")'><b>"+"ABCDE"[i]+".</b> "+esc(c)+"</button>";}).join("")+"</div>";
  }else if(q.type==="unscramble"){
    h+="<div class='build' id='build' style='margin-top:12px'></div><div class='chips'>"+q.wordOrder.map(function(o,i){return "<button class='chip' id='chip"+i+"' onclick='addWord("+i+")'>"+esc(o.w)+"</button>";}).join("")+"</div><button class='btn sec sm' onclick='resetWords()'>↺ Reset</button>";
  }else{
    h+="<input class='ans' id='ans' autocomplete='off' autocorrect='off' autocapitalize='off' spellcheck='false' placeholder='"+(q.type==="sentence"?"Write a full sentence…":"Type your answer…")+"' onkeydown='if(event.key===\"Enter\"){checkAns();}'>";
  }
  h+="<div id='fb'></div><div class='btns'><button class='btn' id='chk' onclick='checkAns()'>Check Answer</button><button class='btn blue' id='nxt' onclick='nextQ()' style='display:none'>"+(S.idx+1<n?"Next ➜":"Submit &amp; See My Score 🏁")+"</button></div></div>";
  app.innerHTML=h;S.checked=false;S.sel=null;S.built=[];
  const a=document.getElementById("ans");if(a){try{a.focus();}catch(e){}}
}
function pick(i){if(S.checked)return;S.sel=i;document.querySelectorAll(".choice").forEach(function(b){b.classList.toggle("sel",Number(b.getAttribute("data-i"))===i);});}
function addWord(i){if(S.checked)return;S.built.push(i);document.getElementById("chip"+i).classList.add("used");drawBuild();}
function removeWord(k){if(S.checked)return;const i=S.built[k];S.built.splice(k,1);document.getElementById("chip"+i).classList.remove("used");drawBuild();}
function resetWords(){if(S.checked)return;S.built=[];document.querySelectorAll(".chip").forEach(function(c){c.classList.remove("used");});drawBuild();}
function drawBuild(){const q=S.list[S.idx];document.getElementById("build").innerHTML=S.built.map(function(i,k){return "<button class='chip' onclick='removeWord("+k+")'>"+esc(q.wordOrder[i].w)+"</button>";}).join("");}
function checkAns(){
  if(S.checked)return;
  const q=S.list[S.idx];let given="";
  if(q.type==="mc"){if(S.sel===null){flash("Please choose an answer first.");return;}given=q.order[S.sel];}
  else if(q.type==="unscramble"){if(!S.built.length){flash("Tap the words to build the sentence.");return;}given=S.built.map(function(i){return q.wordOrder[i].w;}).join(" ");}
  else{given=document.getElementById("ans").value;if(!given.trim()){flash("Please type your answer first.");return;}}
  const ok=q.answer.some(function(x){return norm(x)===norm(given);});
  S.checked=true;S.res[S.idx]={q:q,given:given,ok:ok};
  if(q.type==="mc"){document.querySelectorAll(".choice").forEach(function(b){const i=Number(b.getAttribute("data-i"));b.disabled=true;if(i===S.sel)b.classList.add(ok?"right":"wrong");});}
  const inp=document.getElementById("ans");if(inp)inp.disabled=true;
  document.querySelectorAll(".chip").forEach(function(c){c.disabled=true;});
  document.getElementById("fb").innerHTML=ok?"<div class='fb ok'>Correct! Great job! ✓</div>":"<div class='fb bad'>✗ Not quite.</div><div class='correct'><small>Correct answer:</small>"+esc(q.answer[0])+"</div>";
  document.getElementById("chk").style.display="none";
  const nb=document.getElementById("nxt");nb.style.display="inline-block";try{nb.focus();}catch(e){}
}
function flash(m){document.getElementById("fb").innerHTML="<div class='fb bad' style='background:#fff4e0;color:#a35b00'>"+m+"</div>";}
function nextQ(){if(!S.checked)return;if(S.idx+1<S.list.length){S.idx++;renderQ();window.scrollTo(0,0);}else finish();}
function strip(s){return String(s).replace(/<[^>]+>/g,"");}
function finish(){
  const n=S.list.length;const sc=S.res.filter(function(r){return r&&r.ok;}).length;const p=Math.round(sc/n*100);
  const stars=p>=95?5:p>=85?4:p>=70?3:p>=50?2:1;
  const prev=STATS[S.key]||{best:0,tries:0};STATS[S.key]={best:Math.max(prev.best,p),tries:prev.tries+1,last:p};saveStats();
  const rows=S.res.slice().sort(function(a,b){return (a.ok?1:0)-(b.ok?1:0);});
  let h="<div class='qcard score'><div>"+S.title+"</div><div class='big'>"+sc+" / "+n+"</div><div class='stars'>"+"⭐".repeat(stars)+"</div><div style='font-size:22px;margin:6px 0'>"+p+"% "+(p>=90?"Amazing! 🎉":p>=70?"Good job! 👍":"Keep practicing! 💪")+"</div><div class='btns' style='justify-content:center'>";
  h+=S.key==="mock"?"<button class='btn blue' onclick=\"go('mock')\">🔀 New Random Set</button>":"<button class='btn' onclick=\"go('"+S.key+"')\">↺ Try Again</button>";
  h+="<button class='btn sec' onclick=\"go('home')\">🏠 Home</button></div></div><h3 style='margin:18px 4px 6px'>Review (mistakes first)</h3>";
  rows.forEach(function(r){const qt=r.q.question?strip(r.q.question):strip(r.q.ins);h+="<div class='rev "+(r.ok?"":"x")+"'><div class='q'>"+(r.ok?"✓ ":"✗ ")+esc(qt)+"</div><div>Your answer: <b>"+esc(r.given)+"</b></div><div>Correct answer: <span style='background:var(--hl);padding:2px 6px;border-radius:6px;font-weight:700'>"+esc(r.q.answer[0])+"</span></div></div>";});
  app.innerHTML=h;window.scrollTo(0,0);
}

/* ====================== Oral ====================== */
const REC={mr:null,chunks:[],url:{}};
function oral(){
  let h="<div class='intro'><h2>🗣️ Oral Practice</h2><div>Listen to the question, say your answer in a full sentence, and check your key words.</div><div class='note' style='margin-top:6px'>Estimated — confirm with teacher. (Based on the personal questions in Pathway 3 Unit 1 &amp; 4 and the worksheets.)</div></div>";
  ORAL.forEach(function(o,i){
    h+="<div class='oral'><div class='oq'>"+(i+1)+". "+esc(o.q)+"</div><div class='os'>💬 Sample answer: <b>"+esc(o.s)+"</b></div><div class='ok2'>Key words: "+o.k.map(function(k){return k.split("|").slice(0,4).join(" / ");}).join(" · ")+"</div>"+
    "<div class='btns'><button class='btn sec sm' onclick='speak(ORAL["+i+"].q)'>🔊 Hear Q</button><button class='btn sec sm' id='rec"+i+"' onclick='toggleRec("+i+")'>⏺ Record</button><button class='btn sec sm' onclick='playRec("+i+")'>▶ Play back</button><button class='btn sm' onclick='scoreMe("+i+")'>🎯 Score Me</button></div><div class='res' id='res"+i+"'></div></div>";
  });
  app.innerHTML=h;
}
function speak(t){try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.85;window.speechSynthesis.speak(u);}catch(e){alert("Speech is not supported on this device.");}}
function toggleRec(i){
  const b=document.getElementById("rec"+i);const out=document.getElementById("res"+i);
  if(REC.mr&&REC.mr.state==="recording"){REC.mr.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){out.textContent="Recording is not supported in this browser.";return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    REC.chunks=[];const mr=new MediaRecorder(stream);REC.mr=mr;
    mr.ondataavailable=function(e){if(e.data&&e.data.size)REC.chunks.push(e.data);};
    mr.onstop=function(){const blob=new Blob(REC.chunks,{type:mr.mimeType||"audio/mp4"});REC.url[i]=URL.createObjectURL(blob);stream.getTracks().forEach(function(t){t.stop();});b.textContent="⏺ Record";out.textContent="Recorded! Tap ▶ Play back.";};
    mr.start();b.textContent="⏹ Stop";out.textContent="Recording… tap ⏹ Stop when you finish.";
  }).catch(function(){out.textContent="Microphone permission was not given.";});
}
function playRec(i){if(!REC.url[i]){document.getElementById("res"+i).textContent="Record your answer first.";return;}new Audio(REC.url[i]).play();}
function scoreMe(i){
  const out=document.getElementById("res"+i);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){out.textContent="Speech scoring isn't supported in this browser. Try Safari or Chrome.";return;}
  const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;
  out.textContent="🎙️ Listening… speak now!";
  r.onresult=function(e){
    const said=e.results[0][0].transcript;const ns=" "+norm(said)+" ";const o=ORAL[i];let hit=0;
    o.k.forEach(function(k){if(k.split("|").some(function(a){return ns.indexOf(norm(a))>=0;}))hit++;});
    const kw={};o.k.forEach(function(k){k.split("|").forEach(function(a){norm(a).split(" ").forEach(function(w){kw[w]=1;});});});
    const marked=said.split(/\s+/).map(function(w){return kw[norm(w)]?"<mark>"+esc(w)+"</mark>":esc(w);}).join(" ");
    const p=Math.round(hit/o.k.length*100);
    out.innerHTML="You said: “"+marked+"”<br><b>Key-word match: "+p+"%</b> "+(p===100?"🌟 Excellent!":p>=50?"👍 Good! Try to use all the key words.":"💪 Try again with a full sentence.");
  };
  r.onerror=function(){out.textContent="I couldn't hear you. Please try again.";};
  try{r.start();}catch(e){out.textContent="Please try again.";}
}

drawNav();home();
